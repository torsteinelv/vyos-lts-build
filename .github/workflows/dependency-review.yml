name: Dependency Review

# Scans PRs for dependency changes (this repo's only "dependencies" are
# the GitHub Actions used in workflows) and fails on known-vulnerable
# versions. Free for public repos. Required as a status check via the
# branch ruleset on main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
