name: Build and test VyOS

# Manual trigger only - a full VyOS ISO build is heavy (compiles a kernel,
# FRR, etc.) and version bumps should be a deliberate decision, not
# something that happens automatically on every push. See README.md.
on:
  workflow_dispatch:

# Default to read-only; each job that needs more (release: contents:write
# + the attestation scopes) declares it explicitly. Least-privilege per
# GitHub's own recommendation for Actions workflows.
permissions:
  contents: read

env:
  # STRATEGY: pin "rolling" at a specific commit SHA rather than build the
  # frozen "sagitta-public-unmaintained" LTS branch. Confirmed via a real
  # failed CI run that the LTS branch's package repository
  # (dev.packages.vyos.net/repositories/sagitta) does not resolve at all
  # ("Could not resolve 'dev.packages.vyos.net'") - it's not just stale,
  # it's unreachable. "rolling" uses live, working package mirrors.
  # Pinning a specific commit (rather than the branch head) makes the
  # SOURCE fixed - "rolling" moves constantly, this SHA doesn't. This is
  # NOT the same as bit-for-bit reproducible builds: VyOS's build fetches
  # pre-built .deb packages from packages.vyos.net at build time, and
  # that package repository can change contents for the same VyOS source
  # commit. "Pinned and qualified" is the accurate claim here, not
  # "reproducible" - see README.md.
  # Bumping VYOS_SOURCE_SHA is a deliberate decision - update it here on
  # purpose after reviewing what changed, don't automate it. See README.md
  # "Versioning strategy".
  VYOS_SOURCE_SHA: 22dfa15927f2bd01336ab2c0154800f061b0f2e8
  # Pinned by digest, not just tag - the "rolling" tag itself is mutable
  # and gets overwritten regularly.
  VYOS_BUILD_IMAGE: vyos/vyos-build@sha256:482461a415e2fa05b5b1753bfa5490f6fd349585b88be6c23314867b770bb1a0
  ARCHITECTURE: amd64
  BUILD_BY: vyos-lts-build@github.com
  BUILD_TYPE: release
  VERSION: selflts

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # GitHub Actions doesn't allow the `env` context here (container
      # specs are resolved before env is evaluated) - confirmed via a
      # real 422 from the dispatch API: "Unrecognized named-value: 'env'".
      # Has to be the literal value, kept in sync with VYOS_BUILD_IMAGE
      # above by hand.
      image: vyos/vyos-build@sha256:482461a415e2fa05b5b1753bfa5490f6fd349585b88be6c23314867b770bb1a0
      options: --workdir /vyos --privileged
    outputs:
      version_string: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout pinned commit (not a moving branch head)
        run: |
          git init vyos-build
          cd vyos-build
          git remote add origin https://github.com/vyos/vyos-build
          git fetch --depth=1 origin "$VYOS_SOURCE_SHA"
          git checkout --detach "$VYOS_SOURCE_SHA"

      - name: Compute version string
        id: version
        # This container's default `run:` shell is sh/dash, not bash -
        # confirmed via a real failure ("Bad substitution") on bash-only
        # ${VAR:0:8} substring syntax. `cut` is POSIX and works in dash.
        run: |
          short_sha=$(echo "$VYOS_SOURCE_SHA" | cut -c1-8)
          echo "value=${VERSION}-$(date +%Y%m%d%H%M)-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        working-directory: ./vyos-build
        run: |
          sudo make clean
          # "iso" isn't a build flavor - confirmed by reading the actual
          # current build-vyos-image script: build_flavor is a positional
          # arg that must match a file in data/build-flavors/ (only
          # "generic" exists there, and its image_format is "iso"). The
          # image FORMAT comes from the flavor file, not this argument.
          sudo ./build-vyos-image generic \
            --architecture $ARCHITECTURE \
            --build-by "$BUILD_BY" \
            --build-type $BUILD_TYPE \
            --version "${{ steps.version.outputs.value }}"

      - name: Upload ISO + SBOM artifacts
        # VyOS's own build already generates CycloneDX + SPDX SBOMs
        # (build-vyos-image runs syft internally) - just pick them up
        # alongside the ISO instead of generating a separate one.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vyos-iso
          path: |
            vyos-build/build/vyos-*.iso
            vyos-build/build/vyos-*.cdx.json
            vyos-build/build/vyos-*.spdx.json
          retention-days: 14

  build-qcow2-experimental:
    # Experimental (issue #16), not part of the qualified release - a
    # separate flavor requesting image_format = ["iso", "qcow2"], which
    # vyos-build's own raw_image.py converts to via a real, non-
    # interactive raw-disk-install process (mount the built ISO's
    # squashfs, copy it onto a raw disk, install GRUB) - not our own
    # pexpect-driven CLI installer. continue-on-error and not in
    # "release"'s needs: a failure here must never block the actual ISO
    # release. Rebuilds VyOS from scratch a second time (can't share the
    # `build` job's artifacts - image_format needs to be set before that
    # build runs) - accepted extra CI cost while this remains unproven;
    # worth optimizing later once it's reliable.
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: vyos/vyos-build@sha256:482461a415e2fa05b5b1753bfa5490f6fd349585b88be6c23314867b770bb1a0
      options: --workdir /vyos --privileged
    steps:
      - name: Checkout pinned commit (not a moving branch head)
        run: |
          git init vyos-build
          cd vyos-build
          git remote add origin https://github.com/vyos/vyos-build
          git fetch --depth=1 origin "$VYOS_SOURCE_SHA"
          git checkout --detach "$VYOS_SOURCE_SHA"

      - name: Add an experimental qcow2 flavor
        working-directory: ./vyos-build
        run: |
          cat > data/build-flavors/generic-cloud.toml <<'EOF'
          # Experimental (issue #16) - generic ISO + a raw-image-derived
          # qcow2, for cloud/KVM/Proxmox deployment without an interactive
          # install.
          image_format = ["iso", "qcow2"]
          EOF
          cat data/build-flavors/generic-cloud.toml

          # cloud-init is NOT installed by either of vyos-build's own base
          # package lists (data/live-build-config/package-lists/vyos-base
          # .list.chroot, vyos-utils.list.chroot - confirmed by reading
          # both directly, neither mentions it) - the flavor toml only
          # controls image FORMAT, not packages. Confirmed empirically too:
          # a real --cloud-init test run against a qcow2 built without this
          # file booted to the plain "vyos@vyos:~$" prompt, not the
          # cloud-init-set "vyos@vyos-CLOUD-INIT:~$" one, and the console
          # log had zero "cloud-init" lines anywhere - it genuinely never
          # ran. Same live-build package-list mechanism as the base lists,
          # just our own file requesting the packages this flavor actually
          # needs. cloud-guest-utils (growpart) is a real, documented
          # cloud-init dependency on VyOS - see vyos/vyos-build PR #131 -
          # needed to grow the disk to whatever size the deployed VM
          # actually has, not just what raw_image.py's conversion left it
          # at.
          cat > data/live-build-config/package-lists/cloud-init.list.chroot <<'EOF'
          cloud-init
          cloud-guest-utils
          EOF
          cat data/live-build-config/package-lists/cloud-init.list.chroot

      - name: Build ISO + qcow2
        working-directory: ./vyos-build
        run: |
          sudo make clean
          sudo ./build-vyos-image generic-cloud \
            --architecture $ARCHITECTURE \
            --build-by "$BUILD_BY" \
            --build-type $BUILD_TYPE \
            --version "${VERSION}-qcow2-experimental"

      - name: Upload qcow2 artifact (experimental - not a release asset)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vyos-qcow2-experimental
          path: vyos-build/build/vyos-*.qcow2
          retention-days: 7
          if-no-files-found: warn

  # issue #16, remaining item: verify the qcow2 actually boots AND that
  # cloud-init works on it - not just that the file gets produced (that
  # part was already confirmed by build-qcow2-experimental itself, #27).
  # Uses vyos-build's OWN --cloud-init test mode (scripts/check-qemu-install),
  # which builds a real NoCloud "cidata" seed ISO and boots the qcow2 with
  # it attached - same mechanism Proxmox's own cloud-init support uses, so
  # this is a direct proxy for the real terraform-infra deployment path,
  # not just a synthetic check. continue-on-error while unproven, same as
  # build-qcow2-experimental - promote both once this passes for real.
  test-qcow2-cloud-init:
    needs: build-qcow2-experimental
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present - this job needs a KVM-capable runner."
            exit 1
          fi
          ls -la /dev/kvm

      - name: Download qcow2 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vyos-qcow2-experimental
          path: qcow2

      - name: Checkout same pinned commit for its official test scripts
        run: |
          git init vyos-build-scripts
          cd vyos-build-scripts
          git remote add origin https://github.com/vyos/vyos-build
          git fetch --depth=1 origin "$VYOS_SOURCE_SHA"
          git checkout --detach "$VYOS_SOURCE_SHA"

      - name: Install QEMU + pexpect + tomli
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect python3-tomli python3-tomli-w genisoimage

      - name: Run VyOS's own official cloud-init test against the qcow2
        # --cloud-init builds its own NoCloud "cidata" seed ISO (with a
        # vyos_config_commands user-data payload) and boots the disk with
        # it attached, then verifies the commands actually applied -
        # exactly what we need to know before wiring this into
        # terraform-infra: does cloud-init exist in this image AND does
        # VyOS's own vyos_config_commands mechanism work on first boot.
        #
        # check-qemu-install builds its QEMU monitor unix-socket path by
        # plain string concatenation - literally
        # f"/tmp/qemu-monitor-socket-{disk_img}" (confirmed by reading the
        # script, line ~300) - not just basename+suffix. Any "/" in the
        # --disk value therefore becomes part of the socket's directory
        # component, which QEMU never auto-creates. A short absolute path
        # (/tmp/vyos.qcow2) fixed the earlier "Path must be less than 108
        # bytes" failure but immediately hit a second real one from the
        # same root cause: "Failed to bind socket to
        # /tmp/qemu-monitor-socket-/tmp/vyos.qcow2: No such file or
        # directory" - the socket's own parent dir
        # (/tmp/qemu-monitor-socket-/tmp/) doesn't exist. The only path
        # shape that avoids this entirely is a bare filename with zero
        # "/" characters, resolved via cwd instead - copy into
        # vyos-build-scripts/ itself (where the script already runs from)
        # and pass just the filename.
        #
        # --keep: without it, check-qemu-install's own cleanup block
        # unconditionally removes --disk after the test (pass OR fail,
        # confirmed by reading it - `if not args.keep: os.remove(args.disk)`
        # runs regardless of outcome) - which silently broke the diagnostic
        # step below (it found no vyos.qcow2 to boot at all, a completely
        # separate failure from the one it was meant to explain).
        run: |
          cp "$(find qcow2 -name '*.qcow2' | head -n1)" vyos-build-scripts/vyos.qcow2
          cd vyos-build-scripts
          sudo python3 scripts/check-qemu-install --debug --cloud-init --disk vyos.qcow2 --silent --keep

      - name: Diagnostic boot on failure - capture real console evidence
        # The strict test above (vendor's check-qemu-install) failed with
        # "Device 'eth0' does not exist" even though cloud-init DID run
        # (hostname was already renamed to vyos-CLOUD-INIT by the time it
        # checked) - meaning vyos_config_commands executed but the kernel
        # interface named eth0 wasn't there yet/at all when the script
        # queried it. --silent suppresses the QEMU serial console from the
        # Actions log entirely, so there's no way to see what actually
        # happened from outside. This step reproduces the exact same QEMU
        # invocation and cloud-init seed (copied by hand from the vendor
        # script - see check-qemu-install's CI_CONFIG_ARGS/get_qemu_cmd),
        # but instead of asserting on eth0 it logs in and unconditionally
        # dumps `ip a`, `cloud-init status --long`, and the relevant
        # journalctl units straight to stdout so we get real evidence
        # instead of guessing blind. Only meaningful if the step above
        # failed - if it already passed there's nothing to diagnose.
        if: failure()
        continue-on-error: true
        working-directory: vyos-build-scripts
        run: |
          cat > diag_boot.py <<'PYEOF'
          #!/usr/bin/env python3
          import os
          import sys
          import pexpect

          CI_DATA_DIR = 'diag_ci_data'
          CI_ISO = 'diag_ci_seed.iso'
          os.makedirs(CI_DATA_DIR, exist_ok=True)

          open(f'{CI_DATA_DIR}/meta-data', 'w').close()

          with open(f'{CI_DATA_DIR}/network-config', 'w') as f:
              f.write("""version: 2
          ethernets:
            eth0:
              dhcp4: false
              dhcp6: false
          """)

          with open(f'{CI_DATA_DIR}/user-data', 'w') as f:
              f.write("""#cloud-config
          vyos_config_commands:
            - set system host-name 'vyos-CLOUD-INIT'
            - set service ntp server 1.pool.ntp.org
            - set service ntp server 2.pool.ntp.org
            - delete interfaces ethernet eth0 address 'dhcp'
            - set interfaces ethernet eth0 address '192.0.2.1/25'
            - set interfaces ethernet eth0 address '2001:db8::1/64'
            - set protocols static route 0.0.0.0/0 next-hop '192.0.2.126'
            - set protocols static route6 ::/0 next-hop '2001:db8::ffff'
          """)

          if os.path.exists(CI_ISO):
              os.unlink(CI_ISO)
          os.system(f'mkisofs -joliet -rock -volid "cidata" -output {CI_ISO} {CI_DATA_DIR}')

          macbase = '00:00:5E:00:53'
          qemu_cmd = [
              '/usr/bin/qemu-system-x86_64', '-name', 'VyOS-QEMU-diag',
              '-smp', '2,sockets=1,cores=2,threads=1', '-cpu', 'host',
              '-machine', 'pc,accel=kvm', '-m', '4G', '-nographic', '-vga', 'none',
              '-uuid', 'f48b60b2-e6ad-49ef-9d09-4245d0585e53',
              '-enable-kvm',
              '-monitor', 'unix:/tmp/qemu-monitor-socket-diag,server,nowait',
              '-netdev', 'user,id=n0,net=192.0.2.0/24,dhcpstart=192.0.2.101,dns=192.0.2.10',
              '-device', f'virtio-net-pci,netdev=n0,mac={macbase}:00,romfile=,host_mtu=1500',
              '-netdev', 'user,id=n1',
              '-device', f'virtio-net-pci,netdev=n1,mac={macbase}:01,romfile=,host_mtu=1500',
              '-netdev', 'user,id=n2',
              '-device', f'virtio-net-pci,netdev=n2,mac={macbase}:02,romfile=,host_mtu=1500',
              '-netdev', 'user,id=n3',
              '-device', f'virtio-net-pci,netdev=n3,mac={macbase}:03,romfile=,host_mtu=1500',
              '-netdev', 'user,id=n4',
              '-device', f'e1000e,netdev=n4,mac={macbase}:04,romfile=',
              '-netdev', 'user,id=n5',
              '-device', f'e1000e,netdev=n5,mac={macbase}:05,romfile=',
              '-netdev', 'user,id=n6',
              '-device', f'vmxnet3,netdev=n6,mac={macbase}:06,romfile=',
              '-netdev', 'user,id=n7',
              '-device', f'vmxnet3,netdev=n7,mac={macbase}:07,romfile=',
              '-device', 'virtio-scsi-pci,id=scsi0',
              '-drive', f'file={CI_ISO},format=raw,if=none,media=cdrom,id=drive-cd1,readonly=on',
              '-device', 'ahci,id=achi0',
              '-device', 'ide-cd,bus=achi0.0,drive=drive-cd1,id=cd1,bootindex=10',
              '-drive', 'format=qcow2,file=vyos.qcow2,if=none,media=disk,id=drive-hd1,readonly=off',
              '-device', 'scsi-hd,bus=scsi0.0,drive=drive-hd1,id=hd1,bootindex=1',
          ]

          print('DIAG: launching', ' '.join(qemu_cmd), flush=True)
          c = pexpect.spawn(' '.join(qemu_cmd), timeout=120, encoding='utf-8')
          c.logfile = sys.stdout

          try:
              c.expect('[Ll]ogin:', timeout=600)
              c.sendline('vyos')
              c.expect('[Pp]assword:')
              c.sendline('vyos')
              c.expect(r'[$#]', timeout=60)
              print('\nDIAG: logged in, running diagnostics\n', flush=True)

              for cmd in [
                  'ip a',
                  'ip link show',
                  'cloud-init status --long',
                  'sudo systemctl status vyos-config-cloud-init.service --no-pager -l',
                  'sudo journalctl -u vyos-config-cloud-init -u cloud-init-local -u cloud-init --no-pager | tail -150',
                  'sudo systemctl list-units --failed --no-pager',
                  'cat /etc/cloud/cloud.cfg.d/20_vyos_custom.cfg 2>&1',
                  'cat /etc/cloud/cloud.cfg.d/20_vyos_network.cfg 2>&1',
              ]:
                  print(f'\nDIAG: === {cmd} ===', flush=True)
                  c.sendline(cmd)
                  c.expect(r'[$#]', timeout=60)

              print('\nDIAG: done\n', flush=True)
          except pexpect.exceptions.TIMEOUT:
              print('\nDIAG: TIMEOUT waiting for expected prompt - dumping buffer\n', flush=True)
              print(c.before, flush=True)
          finally:
              c.close(force=True)
          PYEOF
          sudo python3 diag_boot.py

  smoketest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present - this job needs a KVM-capable runner. GitHub-hosted ubuntu-latest has this by default."
            exit 1
          fi
          ls -la /dev/kvm

      - name: Download ISO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vyos-iso
          path: iso

      - name: Checkout same pinned commit for its official test scripts
        run: |
          git init vyos-build-scripts
          cd vyos-build-scripts
          git remote add origin https://github.com/vyos/vyos-build
          git fetch --depth=1 origin "$VYOS_SOURCE_SHA"
          git checkout --detach "$VYOS_SOURCE_SHA"

      - name: Install QEMU + pexpect + tomli
        # python3-tomli is a real, confirmed requirement - check-qemu-install
        # failed with "ModuleNotFoundError: No module named 'tomli'" on the
        # first real run. Matches what's in vyos-build's own Dockerfile
        # (python3-tomli, python3-tomli-w), which we don't get here since
        # this job installs deps on the bare runner, not inside that image.
        # genisoimage (provides mkisofs) is likewise a real, confirmed
        # requirement - the --test-image-update step below failed with
        # "FileNotFoundError: [Errno 2] No such file or directory:
        # 'mkisofs'" on a real run building its own nested-ISO payload.
        # socat - after fixing mkisofs, the same step got further and hit
        # a second real, confirmed gap ("sh: 1: socat: not found" right
        # before "add system image reported an error"); check-qemu-install
        # uses socat itself to talk to QEMU's monitor unix-socket (e.g.
        # ejecting the install CD) as part of that flow.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect python3-tomli python3-tomli-w genisoimage socat

      - name: Run VyOS's own official install/smoketest suite
        run: |
          # --iso is a required named flag on this version, not a
          # positional arg - confirmed via the script's own real usage
          # output ("unrecognized arguments: iso/vyos-...iso").
          #
          # The script also reads data/defaults.toml relative to its OWN
          # cwd, not its own script location - confirmed via
          # "FileNotFoundError: data/defaults.toml" when run from the
          # repo root. Resolve the ISO to an absolute path first, then
          # cd into vyos-build-scripts before invoking it.
          iso=$(readlink -f "$(find iso -name '*.iso' | head -n1)")
          cd vyos-build-scripts
          sudo python3 scripts/check-qemu-install --iso "$iso" --silent

      - name: Run VyOS's own official image-update test (#20)
        # --test-image-update is mutually exclusive with the default test
        # mode above (confirmed in the script's own source - only one
        # "primary mode" flag may be set), so this is a genuinely separate
        # invocation, not an additional flag on the step above. Verifies
        # the real upgrade mechanism (`add system image`, see README) on
        # this exact pinned commit - VyOS's own maintained test, not
        # something we wrote ourselves.
        #
        # Passed on its first real run - promoted to a real gate (no more
        # continue-on-error), same as candidate-config-test once was.
        run: |
          iso=$(readlink -f "$(find iso -name '*.iso' | head -n1)")
          cd vyos-build-scripts
          sudo python3 scripts/check-qemu-install --iso "$iso" --test-image-update --silent

  candidate-config-test:
    needs: build
    runs-on: ubuntu-latest
    # Production gate, not advisory - if this fails, the release does not
    # happen (see the "release" job's "needs:"). Previously had
    # continue-on-error: true while the script was unproven; removed now
    # that it's meant to actually gate releases.
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ISO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vyos-iso
          path: iso

      - name: Install QEMU + pexpect
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect

      - name: Run candidate configuration test
        run: |
          iso=$(find iso -name '*.iso' | head -n1)
          sudo python3 scripts/test-candidate-config.py "$iso" config/qualification.txt

  release:
    needs: [build, smoketest, candidate-config-test]
    runs-on: ubuntu-latest
    # Gates the release step through a named Environment - infrastructure
    # for adding required reviewers later (a second maintainer approving
    # before an ISO actually gets published) without changing anything
    # else about the pipeline. No protection rules configured yet since
    # there's only one maintainer today - see README.md.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ISO + SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vyos-iso
          path: iso

      - name: Stage release assets with their final (uploaded) filenames
        # sha256sum must hash files under the exact name they'll have once
        # uploaded as release assets (just the basename, no "iso/" prefix)
        # - otherwise `sha256sum -c SHA256SUMS` fails for anyone who
        # actually downloads the release and tries to verify it, since the
        # path recorded in the sums file wouldn't exist on their machine.
        run: |
          mkdir -p release
          find iso -type f \( -name '*.iso' -o -name '*.cdx.json' -o -name '*.spdx.json' \) -exec cp {} release/ \;
          ls -la release/

      - name: Build release manifest and checksums
        working-directory: release
        # Plain glob (no ./ prefix) so sha256sum records clean filenames -
        # matches what actually gets uploaded as release assets, so
        # `sha256sum -c SHA256SUMS` works for anyone who downloads them.
        run: |
          sha256sum *.iso *.cdx.json *.spdx.json > SHA256SUMS
          cat > manifest.json <<EOF
          {
            "release": "${{ needs.build.outputs.version_string }}",
            "vyos_source_repo": "https://github.com/vyos/vyos-build",
            "vyos_source_commit": "$VYOS_SOURCE_SHA",
            "build_image": "$VYOS_BUILD_IMAGE",
            "github_run_id": "${{ github.run_id }}",
            "github_repo_commit": "${{ github.sha }}",
            "tested": {
              "official_smoketest": true,
              "candidate_config": true
            }
          }
          EOF
          cat manifest.json

      - name: Generate build provenance attestation for the ISO
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release/*.iso'

      # No separate SBOM attestation - actions/attest's sbom-path input has a
      # hard 16MB file size limit, and VyOS's own generated SPDX file (every
      # package in the full build) is ~39MB - confirmed via a real CI failure
      # ("Error: SBOM file not found", which is a misleading error for a size
      # rejection, not a missing-file one). The SBOM is still a checksummed,
      # attested-provenance-adjacent release asset (covered by SHA256SUMS),
      # just not independently Sigstore-attested itself.

      - name: Create GitHub Release (durable output - don't rely on the 14-day workflow artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          tag="${{ needs.build.outputs.version_string }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Built from vyos/vyos-build@${VYOS_SOURCE_SHA:0:8}, passed the official VyOS smoketest suite and the candidate configuration test. Verify with: sha256sum -c SHA256SUMS && gh attestation verify <iso> -R ${{ github.repository }}. See manifest.json for full provenance." \
            ./*.iso ./*.cdx.json ./*.spdx.json SHA256SUMS manifest.json
