name: Build and test VyOS

# Manual trigger only - a full VyOS ISO build is heavy (compiles a kernel,
# FRR, etc.) and version bumps should be a deliberate decision, not
# something that happens automatically on every push. See README.md.
on:
  workflow_dispatch:

# Default to read-only; each job that needs more (release: contents:write
# + the attestation scopes) declares it explicitly. Least-privilege per
# GitHub's own recommendation for Actions workflows.
permissions:
  contents: read

env:
  # STRATEGY: pin "rolling" at a specific commit SHA rather than build the
  # frozen "sagitta-public-unmaintained" LTS branch. Confirmed via a real
  # failed CI run that the LTS branch's package repository
  # (dev.packages.vyos.net/repositories/sagitta) does not resolve at all
  # ("Could not resolve 'dev.packages.vyos.net'") - it's not just stale,
  # it's unreachable. "rolling" uses live, working package mirrors.
  # Pinning a specific commit (rather than the branch head) makes the
  # SOURCE fixed - "rolling" moves constantly, this SHA doesn't. This is
  # NOT the same as bit-for-bit reproducible builds: VyOS's build fetches
  # pre-built .deb packages from packages.vyos.net at build time, and
  # that package repository can change contents for the same VyOS source
  # commit. "Pinned and qualified" is the accurate claim here, not
  # "reproducible" - see README.md.
  # Bumping VYOS_SOURCE_SHA is a deliberate decision - update it here on
  # purpose after reviewing what changed, don't automate it. See README.md
  # "Versioning strategy".
  VYOS_SOURCE_SHA: 22dfa15927f2bd01336ab2c0154800f061b0f2e8
  # Pinned by digest, not just tag - the "rolling" tag itself is mutable
  # and gets overwritten regularly.
  VYOS_BUILD_IMAGE: vyos/vyos-build@sha256:482461a415e2fa05b5b1753bfa5490f6fd349585b88be6c23314867b770bb1a0
  ARCHITECTURE: amd64
  BUILD_BY: vyos-lts-build@github.com
  BUILD_TYPE: release
  VERSION: selflts

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # GitHub Actions doesn't allow the `env` context here (container
      # specs are resolved before env is evaluated) - confirmed via a
      # real 422 from the dispatch API: "Unrecognized named-value: 'env'".
      # Has to be the literal value, kept in sync with VYOS_BUILD_IMAGE
      # above by hand.
      image: vyos/vyos-build@sha256:482461a415e2fa05b5b1753bfa5490f6fd349585b88be6c23314867b770bb1a0
      options: --workdir /vyos --privileged
    outputs:
      version_string: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout pinned commit (not a moving branch head)
        run: |
          git init vyos-build
          cd vyos-build
          git remote add origin https://github.com/vyos/vyos-build
          git fetch --depth=1 origin "$VYOS_SOURCE_SHA"
          git checkout --detach "$VYOS_SOURCE_SHA"

      - name: Compute version string
        id: version
        # This container's default `run:` shell is sh/dash, not bash -
        # confirmed via a real failure ("Bad substitution") on bash-only
        # ${VAR:0:8} substring syntax. `cut` is POSIX and works in dash.
        run: |
          short_sha=$(echo "$VYOS_SOURCE_SHA" | cut -c1-8)
          echo "value=${VERSION}-$(date +%Y%m%d%H%M)-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        working-directory: ./vyos-build
        run: |
          sudo make clean
          # "iso" isn't a build flavor - confirmed by reading the actual
          # current build-vyos-image script: build_flavor is a positional
          # arg that must match a file in data/build-flavors/ (only
          # "generic" exists there, and its image_format is "iso"). The
          # image FORMAT comes from the flavor file, not this argument.
          sudo ./build-vyos-image generic \
            --architecture $ARCHITECTURE \
            --build-by "$BUILD_BY" \
            --build-type $BUILD_TYPE \
            --version "${{ steps.version.outputs.value }}"

      - name: Upload ISO + SBOM artifacts
        # VyOS's own build already generates CycloneDX + SPDX SBOMs
        # (build-vyos-image runs syft internally) - just pick them up
        # alongside the ISO instead of generating a separate one.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vyos-iso
          path: |
            vyos-build/build/vyos-*.iso
            vyos-build/build/vyos-*.cdx.json
            vyos-build/build/vyos-*.spdx.json
          retention-days: 14

  smoketest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present - this job needs a KVM-capable runner. GitHub-hosted ubuntu-latest has this by default."
            exit 1
          fi
          ls -la /dev/kvm

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vyos-iso
          path: iso

      - name: Checkout same pinned commit for its official test scripts
        run: |
          git init vyos-build-scripts
          cd vyos-build-scripts
          git remote add origin https://github.com/vyos/vyos-build
          git fetch --depth=1 origin "$VYOS_SOURCE_SHA"
          git checkout --detach "$VYOS_SOURCE_SHA"

      - name: Install QEMU + pexpect + tomli
        # python3-tomli is a real, confirmed requirement - check-qemu-install
        # failed with "ModuleNotFoundError: No module named 'tomli'" on the
        # first real run. Matches what's in vyos-build's own Dockerfile
        # (python3-tomli, python3-tomli-w), which we don't get here since
        # this job installs deps on the bare runner, not inside that image.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect python3-tomli python3-tomli-w

      - name: Run VyOS's own official install/smoketest suite
        run: |
          # --iso is a required named flag on this version, not a
          # positional arg - confirmed via the script's own real usage
          # output ("unrecognized arguments: iso/vyos-...iso").
          #
          # The script also reads data/defaults.toml relative to its OWN
          # cwd, not its own script location - confirmed via
          # "FileNotFoundError: data/defaults.toml" when run from the
          # repo root. Resolve the ISO to an absolute path first, then
          # cd into vyos-build-scripts before invoking it.
          iso=$(readlink -f "$(find iso -name '*.iso' | head -n1)")
          cd vyos-build-scripts
          sudo python3 scripts/check-qemu-install --iso "$iso" --silent

  candidate-config-test:
    needs: build
    runs-on: ubuntu-latest
    # Production gate, not advisory - if this fails, the release does not
    # happen (see the "release" job's "needs:"). Previously had
    # continue-on-error: true while the script was unproven; removed now
    # that it's meant to actually gate releases.
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vyos-iso
          path: iso

      - name: Install QEMU + pexpect
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect

      - name: Run candidate configuration test
        run: |
          iso=$(find iso -name '*.iso' | head -n1)
          sudo python3 scripts/test-candidate-config.py "$iso" config/qualification.txt

  release:
    needs: [build, smoketest, candidate-config-test]
    runs-on: ubuntu-latest
    # Gates the release step through a named Environment - infrastructure
    # for adding required reviewers later (a second maintainer approving
    # before an ISO actually gets published) without changing anything
    # else about the pipeline. No protection rules configured yet since
    # there's only one maintainer today - see README.md.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download ISO + SBOM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vyos-iso
          path: iso

      - name: Stage release assets with their final (uploaded) filenames
        # sha256sum must hash files under the exact name they'll have once
        # uploaded as release assets (just the basename, no "iso/" prefix)
        # - otherwise `sha256sum -c SHA256SUMS` fails for anyone who
        # actually downloads the release and tries to verify it, since the
        # path recorded in the sums file wouldn't exist on their machine.
        run: |
          mkdir -p release
          find iso -type f \( -name '*.iso' -o -name '*.cdx.json' -o -name '*.spdx.json' \) -exec cp {} release/ \;
          ls -la release/

      - name: Build release manifest and checksums
        working-directory: release
        # Plain glob (no ./ prefix) so sha256sum records clean filenames -
        # matches what actually gets uploaded as release assets, so
        # `sha256sum -c SHA256SUMS` works for anyone who downloads them.
        run: |
          sha256sum *.iso *.cdx.json *.spdx.json > SHA256SUMS
          cat > manifest.json <<EOF
          {
            "release": "${{ needs.build.outputs.version_string }}",
            "vyos_source_repo": "https://github.com/vyos/vyos-build",
            "vyos_source_commit": "$VYOS_SOURCE_SHA",
            "build_image": "$VYOS_BUILD_IMAGE",
            "github_run_id": "${{ github.run_id }}",
            "github_repo_commit": "${{ github.sha }}",
            "tested": {
              "official_smoketest": true,
              "candidate_config": true
            }
          }
          EOF
          cat manifest.json

      - name: Generate build provenance attestation for the ISO
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release/*.iso'

      - name: Generate SBOM attestation for the ISO
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release/*.iso'
          sbom-path: 'release/*.spdx.json'

      - name: Create GitHub Release (durable output - don't rely on the 14-day workflow artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          tag="${{ needs.build.outputs.version_string }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Built from vyos/vyos-build@${VYOS_SOURCE_SHA:0:8}, passed the official VyOS smoketest suite and the candidate configuration test. Verify with: sha256sum -c SHA256SUMS && gh attestation verify <iso> -R ${{ github.repository }}. See manifest.json for full provenance." \
            ./*.iso ./*.cdx.json ./*.spdx.json SHA256SUMS manifest.json
