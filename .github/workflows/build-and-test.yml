name: Build and test VyOS LTS

# Manual trigger only - a full VyOS ISO build is heavy (compiles a kernel,
# FRR, etc.) and version bumps should be a deliberate decision, not
# something that happens automatically on every push. See README.md.
on:
  workflow_dispatch:

env:
  # Pinned LTS branch. As of 2026-09-15, VyOS has renamed this branch to
  # "sagitta-public-unmaintained" upstream (confirmed via the GitHub
  # branches API) - the plain "sagitta" branch no longer exists, only the
  # Docker Hub image tag "sagitta" is kept as a legacy alias. The
  # "-public-unmaintained" suffix means VyOS itself is no longer actively
  # backporting fixes to the free/public branch (paying customers get
  # continued support elsewhere) - which is exactly why building and
  # testing this yourself, rather than trusting an upstream that may not
  # be maintaining it, is the point of this repo.
  # Bumping this to a new LTS is a deliberate decision - update it here
  # on purpose, don't automate it.
  VYOS_BRANCH: sagitta-public-unmaintained
  ARCHITECTURE: amd64
  BUILD_BY: vyos-lts-build@github.com
  BUILD_TYPE: release
  VERSION: 1.4-lts-build

jobs:
  build:
    runs-on: ubuntu-latest
    # Official, VyOS-published image matching the pinned LTS branch - see
    # https://hub.docker.com/r/vyos/vyos-build/tags. Avoids rebuilding the
    # (very heavy) build environment from Dockerfile on every run.
    container:
      image: vyos/vyos-build:sagitta
      options: --workdir /vyos --privileged
    steps:
      - name: Clone vyos-build (pinned branch)
        run: git clone -b $VYOS_BRANCH --single-branch https://github.com/vyos/vyos-build

      - name: Patch data/defaults.toml (upstream branch rename not fully propagated)
        # data/defaults.toml still hardcodes vyos_branch = "sagitta" on the
        # sagitta-public-unmaintained branch itself - the build script uses
        # this value to check out component repos (e.g. vyos-1x), which
        # were ALSO renamed to "-public-unmaintained". Confirmed via a real
        # failed run: "Could not retrieve vyos-1x from branch sagitta".
        # This is an upstream inconsistency (branch renamed, this file
        # wasn't updated to match), not something wrong on our end.
        working-directory: ./vyos-build
        run: |
          sed -i "s/^vyos_branch = .*/vyos_branch = \"$VYOS_BRANCH\"/" data/defaults.toml
          grep vyos_branch data/defaults.toml

      - name: Build ISO
        working-directory: ./vyos-build
        run: |
          sudo make clean
          sudo ./build-vyos-image iso \
            --architecture $ARCHITECTURE \
            --build-by "$BUILD_BY" \
            --build-type $BUILD_TYPE \
            --version $VERSION-$(date +%Y%m%d%H%M)

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyos-iso
          path: vyos-build/build/vyos-*.iso
          retention-days: 14

  smoketest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present - this job needs a KVM-capable runner. GitHub-hosted ubuntu-latest has this by default; a self-hosted runner needs nested virtualization enabled explicitly."
            exit 1
          fi
          ls -la /dev/kvm

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: vyos-iso
          path: iso

      - name: Clone vyos-build for its own official test scripts
        run: git clone -b $VYOS_BRANCH --single-branch --depth 1 https://github.com/vyos/vyos-build vyos-build-scripts

      - name: Install QEMU + pexpect
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect

      - name: Run VyOS's own official install/smoketest suite
        run: |
          iso=$(find iso -name '*.iso' | head -n1)
          sudo python3 vyos-build-scripts/scripts/check-qemu-install "$iso" --silent

  candidate-config-test:
    needs: build
    runs-on: ubuntu-latest
    # Experimental - see README.md "Pipeline" section. Doesn't block the
    # rest of the pipeline while this is still being proven out.
    continue-on-error: true
    steps:
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: vyos-iso
          path: iso

      - name: Install QEMU + pexpect
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect

      - name: Run candidate configuration test
        run: |
          iso=$(find iso -name '*.iso' | head -n1)
          sudo python3 scripts/test-candidate-config.py "$iso" config/candidate.txt
